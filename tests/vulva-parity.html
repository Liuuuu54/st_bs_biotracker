<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外陰像素比對</title>
<style>
  body { margin: 0; padding: 12px; background: #14111b; color: #e6dfe8; font: 13px/1.5 system-ui, sans-serif; }
  iframe { width: 1200px; height: 400px; border: 1px solid #3a3144; }
  #out { font-family: ui-monospace, monospace; white-space: pre-wrap; }
  .pair { display: inline-flex; gap: 2px; margin: 2px; }
  canvas { image-rendering: pixelated; width: 192px; height: 240px; border: 1px solid #3a3144; }
</style>
</head>
<body>
<p>預覽頁（iframe）與 <code>scripts/vulva_render.js</code> 用同一組控件值各畫一次，逐像素比對正面圖。用本機伺服器開：<code>node tests/ui_server.mjs 8017</code>，再開 <code>/tests/vulva-parity.html</code>。</p>
<div id="out">載入中…</div>
<div id="diffs"></div>
<iframe id="preview" src="../previews/vulva-preview.html"></iframe>
<script type="module">
import { createVulvaRenderer, VULVA_DEFAULTS } from '../scripts/vulva_render.js';

const out = document.getElementById('out');
const frame = document.getElementById('preview');
await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
const doc = frame.contentDocument;
const win = frame.contentWindow;
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const ids = Object.keys(VULVA_DEFAULTS);
const setPreview = (values) => {
  for (const [id, value] of Object.entries(values)) {
    const node = doc.getElementById(id);
    if (!node) throw new Error(`preview has no #${id}`);
    node.value = String(value);
    node.dispatchEvent(new win.Event('input', { bubbles: true }));
  }
};
const readPreview = () => Object.fromEntries(ids.map((id) => [id, doc.getElementById(id)?.value ?? VULVA_DEFAULTS[id]]));

const canvas = Object.assign(document.createElement('canvas'), { width: 96, height: 120 });
const renderer = createVulvaRenderer(canvas, { reducedMotion: true });

// 動畫都停在代表格：預覽頁也開 reduced motion
win.matchMedia = () => ({ matches: true, addEventListener() {} });

const races = ['人類', '鬣狗族', '蛇人', '寶石人', '海馬族', '奇美拉', '原獸族', '史萊姆', '燭靈', '人偶', '麒麟', '鳥族'];
const cases = [];
for (const race of races) cases.push({ label: race, values: { 'race-preset': race } });
for (const layout of ['human', 'tube', 'single', 'anal']) for (const prolapse of ['0', '2', '4']) {
  cases.push({ label: `${layout} 宮脫${prolapse}`, values: { 'race-preset': '人類', layout, prolapse } });
}
for (const pregnancy of ['1', '2', '3']) cases.push({ label: `孕期 ${pregnancy}`, values: { 'race-preset': '人類', pregnancy } });
cases.push({ label: '扶她 雙劍 尖錐 球結 青筋', values: { 'race-preset': '人類', layout: 'human', 'human-sire': 'on', swordTwin: 'on', swordTip: 'tapered', swordKnot: 'on', swordShaft: 'veined', libido: '95' } });
cases.push({ label: '扶她 喇叭頭 倒刺 無陰囊', values: { 'race-preset': '人類', layout: 'human', 'human-sire': 'on', swordTip: 'flared', swordBarbs: 'on', swordScrotum: 'hidden' } });
cases.push({ label: '泄殖腔 鞘內劍 插入別人', values: { 'race-preset': '蛇人', 'single-sire': 'on', 'single-role': 'giving', libido: '40' } });
cases.push({ label: '泄殖腔 鞘內劍 性慾高', values: { 'race-preset': '蛇人', 'single-sire': 'on', 'single-role': 'idle', libido: '95' } });
for (const shape of ['small', 'large', 'claude', 'gpt', 'gemini']) cases.push({ label: `肛門 ${shape}`, values: { 'race-preset': '人類', 'anus-shape': shape } });
for (const shape of ['claude', 'gpt', 'gemini']) cases.push({ label: `男孕 肛門 ${shape} 宮脫2`, values: { 'race-preset': '人類', layout: 'anal', 'anus-shape': shape, prolapse: '2' } });
cases.push({ label: '男孕 管狀尿道分娩', values: { 'race-preset': '人類', layout: 'tube', 'sire-form': 'urethral' } });
cases.push({ label: '自然分娩 3 次 恢復 30%', values: { 'race-preset': '人類', parity: '3', recovery: '30' } });
cases.push({ label: '處女膜 完整', values: { 'race-preset': '人類', hymen: 'intact' } });
cases.push({ label: '處女膜 殘痕', values: { 'race-preset': '人類', hymen: 'torn' } });
cases.push({ label: '泄殖腔 處女膜 完整', values: { 'race-preset': '蛇人', hymen: 'intact' } });
cases.push({ label: '袋獸口 處女膜 殘痕', values: { 'race-preset': '奇美拉', hymen: 'torn' } });
cases.push({ label: '管狀 處女膜 完整', values: { 'race-preset': '鬣狗族', hymen: 'intact' } });
cases.push({ label: '成熟度低 痕跡高', values: { 'race-preset': '人類', 'visual-maturity': '10', 'visual-traces': '95' } });

let pass = 0;
const lines = [];
for (const item of cases) {
  setPreview({ 'race-preset': '人類' });
  setPreview(item.values);
  // 鞘內劍翻出要 380 ms；像素、影紋這類會流動的材質一直在動，不列入比對
  await wait(700);
  const state = readPreview();
  const previewCanvas = doc.querySelector('canvas');
  const expected = previewCanvas.getContext('2d').getImageData(0, 0, 96, 120).data;
  renderer.setState(state);
  renderer.paint();
  const actual = canvas.getContext('2d').getImageData(0, 0, 96, 120).data;
  let diff = 0;
  for (let i = 0; i < expected.length; i += 4) if (expected[i] !== actual[i] || expected[i + 1] !== actual[i + 1] || expected[i + 2] !== actual[i + 2]) diff++;
  if (diff === 0) pass++;
  else {
    const pair = document.createElement('div'); pair.className = 'pair';
    const a = Object.assign(document.createElement('canvas'), { width: 96, height: 120 }); a.getContext('2d').drawImage(previewCanvas, 0, 0);
    const b = Object.assign(document.createElement('canvas'), { width: 96, height: 120 }); b.getContext('2d').drawImage(canvas, 0, 0);
    pair.append(a, b); pair.title = item.label;
    document.getElementById('diffs').appendChild(pair);
  }
  lines.push(`${diff === 0 ? 'PASS' : 'FAIL'} ${item.label}${diff ? `（${diff} 像素不同）` : ''}`);
}
out.textContent = `${pass}/${cases.length} 相同\n${lines.join('\n')}`;
window.__parity = { pass, total: cases.length, lines };
</script>
</body>
</html>
