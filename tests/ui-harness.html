<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioTracker UI Harness</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; min-height: 100vh; background: #2b2b33; font-family: sans-serif; color: #ddd; }
  #harness-info { padding: 12px 16px; font-size: 13px; line-height: 1.6; opacity: .8; }
</style>
</head>
<body>
<div id="harness-info">
  <b>BioTracker UI Harness</b>（mock 宿主，非真实 SillyTavern）。点击右下角悬浮球打开手机面板。使用者：旅人。
  <details id="harness-roster"><summary>种子角色（一人一个主题，展开查看）</summary><ul id="harness-roster-list"></ul></details>
  <div id="harness-anim" style="margin-top:6px">动画台：
    <select id="harness-anim-who"></select>
    <select id="harness-anim-cue"></select>
    <button type="button" data-anim-tab="pregnancy">播（妊娠页・子宫图）</button>
    <button type="button" data-anim-tab="description">播（描述页・孕体特写）</button>
  </div>
</div>
<script type="module">
  const CHAT_KEY = 'ui-harness-chat';
  const { createDefaultFemaleState } = await import('/scripts/state.js');
  const { buildRoster, applyRosterTools, ROSTER_NOTES, USER_NAME, HARNESS_CALENDAR } = await import('/tests/ui-harness-roster.mjs');

  // 族谱／写实世界展示用的简单角色（以预设状态为底，栏位齐全）
  const makeCharacter = (name, overrides = {}) => {
    const character = createDefaultFemaleState(name);
    character.initialized = true;
    Object.assign(character.profile.base, { stage: '卵泡期', days: 3, age: 24, ...overrides.base });
    Object.assign(character.profile, overrides.profile || {});
    return character;
  };

  const { CHAT_STATE_SCHEMA_VERSION } = await import('/scripts/state_migration.js');
  const roster = buildRoster();
  const chatState = {
    // 名单已是当前结构，不跑迁移（迁移会按名字重抽身体倾向）
    schemaVersion: CHAT_STATE_SCHEMA_VERSION,
    skillCatalog: roster.skillCatalog,
    nextSkillId: roster.nextSkillId,
    characters: roster.characters,
    sires: roster.sires,
    snapshots: [],
    lastOperationLogs: [],
  };

  const ctx = {
    chatId: CHAT_KEY,
    characters: [{ name: '索菲亚', avatar: 'aila.png', description: '测试角色卡。' }],
    characterId: 0,
    name1: USER_NAME,
    name2: '索菲亚',
    chat: [],
    extensionSettings: {
      bs_biotracker: {
        enabled: true,
        theme: 'retro',
        deviceSize: 'phone',
        fontSize: 'standard',
        targetNames: '',
        chatStates: { [CHAT_KEY]: chatState },
        // 对话历法：真机拟定的样本，百科「历法」与首页「日历」看得到
        calendar: structuredClone(HARNESS_CALENDAR),
      },
    },
    saveSettingsDebounced() {},
    eventSource: { on() {}, off() {}, removeListener() {}, once() {} },
    event_types: {},
    async loadWorldInfo(name) {
      const books = {
        '全局设定书': { name: '全局设定书', entries: [{ uid: 1, comment: '世界观总纲', content: '大陆历八百年。', disable: false }] },
        '性格适配衣橱': { name: '性格适配衣橱', entries: [
          { uid: 1, comment: '衣橱-日常', content: '日常便服清单。', disable: false },
          { uid: 2, comment: '衣橱-礼服', content: '正式场合衣着。', disable: false },
          { uid: 3, comment: '衣橱-战斗\n\n<!-- ACU_SKILL_META_START\n{"version":1,"description":"战斗装"}\n-->', content: '战斗装配置。', disable: false },
        ] },
      };
      return books[name] || null;
    },
  };

  globalThis.SillyTavern = { getContext: () => ctx };
  globalThis.toastr = { success() {}, error() {}, info() {}, warning() {} };
  // mock world-info 模块：全局启用书 + 当前角色（aila.png）的附加知识书 charLore
  globalThis.__bsBtWorldInfoModuleOverride__ = {
    selected_world_info: ['全局设定书'],
    world_info: {
      globalSelect: ['全局设定书'],
      charLore: [{ name: 'aila', extraBooks: ['性格适配衣橱'] }],
    },
  };

  // 衣着、转化、回归、经历样本全部经公开分派器套用，避免直接塞最终状态掩盖接线问题
  applyRosterTools(chatState);
  const rosterList = document.getElementById('harness-roster-list');
  for (const [name, note] of Object.entries(ROSTER_NOTES)) {
    const row = document.createElement('li');
    row.textContent = `${name}：${note}`;
    rosterList.appendChild(row);
  }

  // 动画台：写入 profile.visualCue（seq 加一）再切到该角色的分页，走真实的画面事件管线
  const ANIM_CUES = [
    ['insert', '插入'], ['insertCondom', '戴套插入'], ['ejaculate', '射精'], ['ejaculateCondom', '射在套里'], ['condomBreak', '套子破裂'], ['condomOverflow', '套子撑爆'], ['orgasm', '高潮'],
    ['ovulation', '排卵'], ['fertilization', '受精'], ['implantation', '着床'], ['implantationFailed', '着床失败'], ['surrogacy', '代孕植入'], ['chimera', '嵌合融合'], ['rebirth', '胎内回归'], ['rupture', '破水'],
    ['siblingKick', '两胎互踢'], ['siblingShove', '两胎推挤'], ['siblingCuddle', '两胎依偎'], ['falseContraction', '假宫缩'],
  ];
  const whoSelect = document.getElementById('harness-anim-who');
  const cueSelect = document.getElementById('harness-anim-cue');
  for (const name of Object.keys(ROSTER_NOTES)) whoSelect.add(new Option(name, name));
  for (const [type, label] of ANIM_CUES) cueSelect.add(new Option(label, type));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  document.querySelectorAll('#harness-anim [data-anim-tab]').forEach((button) => button.addEventListener('click', async () => {
    const name = whoSelect.value;
    const profile = chatState.characters[name]?.profile;
    if (!profile) return;
    // 已播过的号码记在 localStorage，重载后照样在；用时间戳当号码，保证每按一次都是新的
    profile.visualCue = { type: cueSelect.value, seq: Date.now() };
    document.querySelector('#bs-biotracker-settings [data-nav-view="track-list"]')?.click();
    await sleep(50);
    [...document.querySelectorAll('.bs-bt-track-character-button')].find((node) => node.querySelector('.bs-bt-track-character-name')?.textContent === name)?.click();
    await sleep(50);
    document.querySelector(`#bs-bt-track-tabs .bs-bt-track-tab[data-track-tab="${button.dataset.animTab}"]`)?.click();
  }));

  // 族谱种族图示展示：/tests/ui-harness.html?lineage=1 另外种一个三代家族，不动原有测试角色。
  // 每人一个衍生外框（11 种），混血拼色底从两块到五块；九尾 50／50 平手时按母方取妖狐。
  // 追踪 → 莉瑟 → 经历 → 族谱。
  if (new URLSearchParams(location.search).get('lineage') === '1') {
    const q = 0.25, e = 0.125;
    const lise = { 妖狐: q, 白泽: q, 精灵: q, 矮人: q };
    const halfLise = (other) => ({ 妖狐: e, 白泽: e, 精灵: e, 矮人: e, [other]: 0.5 });
    const kid = (fields) => ({ talents: [], ...fields });
    const seed = (name, base, children) => {
      chatState.characters[name] = makeCharacter(name, { base: { isHere: false, ...base }, profile: { children } });
    };
    seed('玉藻', { race: '妖狐', bloodline: { 妖狐: 1 }, bloodlineSource: 'pure', derivedType: '神祇', age: 900 }, [
      kid({ id: 'show-1', name: '九尾', gender: '女', race: '妖狐x白泽', bloodline: { 妖狐: 0.5, 白泽: 0.5 }, derivedType: '妖怪', fathers: '泽', fatherRace: '白泽', fatherDerivedType: '修炼', age: 300, registeredAs: '九尾' }),
    ]);
    seed('艾莉丝', { race: '精灵', bloodline: { 精灵: 1 }, bloodlineSource: 'pure', derivedType: '魔导', age: 260 }, [
      kid({ id: 'show-2', name: '洛恩', gender: '男', race: '精灵x矮人', bloodline: { 精灵: 0.5, 矮人: 0.5 }, derivedType: '兽化', fathers: '格雷', fatherRace: '矮人', fatherDerivedType: '器灵', age: 140, registeredAs: '洛恩' }),
    ]);
    seed('九尾', { race: '妖狐x白泽', bloodline: { 妖狐: 0.5, 白泽: 0.5 }, bloodlineSource: 'inherited', derivedType: '妖怪', age: 300 }, [
      kid({ id: 'show-3', name: '莉瑟', gender: '女', race: '妖狐x白泽x精灵x矮人', bloodline: lise, derivedType: '变异', fathers: '洛恩', fatherRace: '精灵x矮人', fatherBloodline: { 精灵: 0.5, 矮人: 0.5 }, fatherDerivedType: '兽化', age: 24, registeredAs: '莉瑟' }),
    ]);
    seed('洛恩', { race: '精灵x矮人', bloodline: { 精灵: 0.5, 矮人: 0.5 }, bloodlineSource: 'inherited', derivedType: '兽化', age: 140 }, []);
    seed('莉瑟', { race: '妖狐x白泽x精灵x矮人', bloodline: lise, bloodlineSource: 'inherited', derivedType: '变异', age: 24, isHere: true }, [
      kid({ id: 'show-5', name: '红鳞', gender: '男', race: '妖狐x白泽x精灵x矮人x西方龙', bloodline: halfLise('西方龙'), derivedType: '血族', fathers: '夜王', fatherRace: '西方龙', fatherDerivedType: '不死', age: 3 }),
      kid({ id: 'show-6', name: '汐', gender: '女', race: '妖狐x白泽x精灵x矮人x人鱼', bloodline: halfLise('人鱼'), fathers: '海德', fatherRace: '人鱼', age: 1 }),
      kid({ id: 'show-7', name: '零', gender: '无', race: '妖狐x白泽x精灵x矮人x宝石人', bloodline: halfLise('宝石人'), derivedType: '机械', fathers: '晶', fatherRace: '宝石人', age: 0 }),
    ]);
    const note = document.createElement('div');
    note.textContent = '已加载族谱展示家族：追踪名单选择「莉瑟」→ 经历 → 族谱。';
    document.getElementById('harness-info').appendChild(note);
  }

  // 写实世界族谱：/tests/ui-harness.html?realistic=1 开启写实世界，另种一个三代人类家族，
  // 一次涵盖精方、卵方（代孕的卵源）与婴儿到长者六段。追踪 → 外婆 → 经历 → 族谱。
  if (new URLSearchParams(location.search).get('realistic') === '1') {
    ctx.extensionSettings.bs_biotracker.realisticWorld = true;
    const kid = (fields) => ({ talents: [], race: '人类', bloodline: { 人类: 1 }, ...fields });
    const seed = (name, base, children) => {
      chatState.characters[name] = makeCharacter(name, { base: { isHere: false, race: '人类', bloodline: { 人类: 1 }, bloodlineSource: 'pure', ...base }, profile: { children } });
    };
    seed('外婆', { age: 72 }, [
      kid({ id: 'real-1', name: '妈妈', gender: '女', fathers: '外公', age: 47, registeredAs: '妈妈' }),
    ]);
    seed('妈妈', { age: 47 }, [
      kid({ id: 'real-2', name: '晓雯', gender: '女', fathers: '爸爸', age: 24, registeredAs: '晓雯' }),
      kid({ id: 'real-3', name: '妹妹', gender: '女', fathers: '爸爸', age: 15 }),
      kid({ id: 'real-4', name: '弟弟', gender: '男', fathers: '爸爸', age: 8 }),
    ]);
    seed('晓雯', { age: 24, isHere: true }, [
      kid({ id: 'real-5', name: '宝宝', gender: '男', fathers: '丈夫', age: 1 }),
      kid({ id: 'real-6', name: '代孕女', gender: '女', fathers: '丈夫', provider: '捐卵者', age: 0 }),
    ]);
    const note = document.createElement('div');
    note.textContent = '已开启写实世界并加载人类家族：追踪名单选择「晓雯」→ 经历 → 族谱。';
    document.getElementById('harness-info').appendChild(note);
  }

  // Optional stage matrix: /tests/ui-harness.html?progress=1 keeps the ordinary seeds intact.
  if (new URLSearchParams(location.search).get('progress') === '1') {
    const { stageProgressFixtures } = await import('/tests/stage-progress-fixtures.mjs');
    const fixtures = stageProgressFixtures();
    fixtures.forEach(({ id, profile }) => {
      const label = id.replace('-start', '·起点').replace('-half', '·中段').replace('-end', '·终点');
      const name = `进度·${label}`;
      chatState.characters[name] = { name, initialized: true, profile };
    });
    // 子宫图警示：孕中期宫压过高且已警告过（推进时间就会流产，所以不放预设名单）
    const { progressProfile } = await import('/tests/stage-progress-fixtures.mjs');
    const danger = progressProfile('孕中期', { days: 40, base: { uterinePressure: 999, isHere: true }, pregnant: { fetuses: [{ embryoId: 1, fathers: '凯', fatherRace: '人类', race: '人类', embryoType: '胎生', gender: '男', weight: 1, tendencyAngle: 90, affinity: -20, health: 60, healthMax: 100, talents: [] }] } });
    danger.cooldown = { ...(danger.cooldown || {}), pregnancyPressureWarning: true };
    chatState.characters['进度·宫压将流产'] = { name: '进度·宫压将流产', initialized: true, profile: danger };
    const note = document.createElement('div');
    note.textContent = `已加载 ${fixtures.length} 个阶段／子阶段进度样本：追踪名单选择「进度·」角色查看概览。`;
    document.getElementById('harness-info').appendChild(note);
  }

  await import('/index.js');

  // 启动后自动打开手机面板：悬浮球初始隐藏且只认 pointer 事件，这里合成一次点击。
  const autoOpen = (retries = 40) => {
    const sphere = document.getElementById('bs-bt-floating-sphere');
    const modal = document.getElementById('bs-biotracker-modal');
    if (modal && getComputedStyle(modal).display !== 'none') return;
    if (!sphere) {
      if (retries > 0) setTimeout(() => autoOpen(retries - 1), 250);
      return;
    }
    sphere.style.display = 'flex';
    const rect = sphere.getBoundingClientRect();
    const cx = rect.x + rect.width / 2;
    const cy = rect.y + rect.height / 2;
    sphere.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, bubbles: true, pointerId: 1 }));
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: cx, clientY: cy, bubbles: true, pointerId: 1 }));
    setTimeout(() => {
      const opened = document.getElementById('bs-biotracker-modal');
      if ((!opened || getComputedStyle(opened).display === 'none') && retries > 0) autoOpen(retries - 1);
    }, 500);
  };
  setTimeout(() => autoOpen(), 600);
</script>
</body>
</html>
